name: Source package checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repository.py
      - run: python3 -m py_compile scripts/*.py loader/*.py
      - run: bash -n scripts/*.sh
      - run: python3 tests/test_source_preparation.py
      - run: |
          cc -fsanitize=address,undefined -Wall -Wextra -Werror tests/wifi-mac-selection-test.c -o /tmp/mac-test
          /tmp/mac-test
          c++ -std=c++17 -pthread -fsanitize=address,undefined -Wall -Wextra -Werror tests/bt-dump-snapshot-test.cpp -o /tmp/dump-test
          /tmp/dump-test
